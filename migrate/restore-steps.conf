# Staged restore steps for migrate/restore-all.sh
# Format: step_id|human label|comma-separated ONLY= paths (manifest relpaths)
#
precheck|Verify backup mount and paths|
secrets|SSH keys and GPG|.ssh,.gnupg
cursor|Cursor and VS Code state|.config/Cursor,.cursor,.config/Code
desktop|Fish, Spotify, gcloud, compose|.config/spotify,.config/gcloud,.config/fish/fish_variables,.local/share/fish,compose.yaml
browser|Firefox profile|.mozilla/firefox
vm|Windows Docker VM|windows,window_data
git|Staged ~/git restore (sub-steps, see restore-git.sh)|@git
system|spotify-adblock.so (optional)|
