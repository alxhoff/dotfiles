# Staged ~/git restore for migrate/restore-git.sh
# Format: step_id|label|path_key|[exclude_file in migrate/]
#
# path_key:
#   git-scaffold     — mkdir ~/git/Github only
#   github-exclude-large — rsync git/Github/ excluding git-large-repos.txt
#   git/<path>       — rsync one tree (relative to $HOME)
#
scaffold|Create ~/git directory layout|git-scaffold|
github-small|Small Github repos (~2G each)|github-exclude-large|git-large-repos.txt
cartken|Cartken without SDK docker output (~29G)|git/cartken|git-cartken.exclude

github-kicad|kicad|git/Github/kicad|
github-fish-bot|fish_bot|git/Github/fish_bot|
github-linux-tegra|linux-tegra-5.10|git/Github/linux-tegra-5.10|
github-linux|linux tree|git/Github/linux|
github-realsense-mipi|realsense_mipi_platform_driver|git/Github/realsense_mipi_platform_driver|
github-kernel-patcher|kernel_patcher (.builder)|git/Github/kernel_patcher|
github-pizero|pizero buildroot|git/Github/pizero_linux_from_scratch|
github-my-ubuntu|my_ubuntu|git/Github/my_ubuntu|
kb-core|kernel_builder without bulk artifacts|git/Github/kernel_builder|git-kernel-builder-lite.exclude
kb-storage|kernel_builder storage/ (compiled kernels)|git/Github/kernel_builder/storage|
kb-scripts-ota|kernel_builder scripts/ota|git/Github/kernel_builder/scripts/ota|
kb-scripts-flash|kernel_builder scripts/flash|git/Github/kernel_builder/scripts/flash|
kb-scripts-utils|kernel_builder scripts/utils|git/Github/kernel_builder/scripts/utils|
kb-scripts-rootfs|Tegra / rootfs trees|git/Github/kernel_builder/scripts/rootfs|
kb-scripts-usb|USB disk images|git/Github/kernel_builder/scripts/usb_disk|
