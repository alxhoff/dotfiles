# Dotfiles — merge into ~/.config/hypr/conf/autostart.conf (ML4W)
# Display hotplug listener (see endeavour/displays/README.md)
exec-once = ~/.config/dotfiles/endeavour/displays/restart-display-listener.sh
# Network / bluetooth tray (packages: network-manager-applet, blueman)
exec-once = nm-applet
exec-once = blueman-applet
