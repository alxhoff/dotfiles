# Dotfiles — merge into ~/.config/hypr/conf/autostart.conf (ML4W)
# Auto monitor profiles (~/.config/kanshi/config from dotfiles)
exec-once = kanshi
# Network / bluetooth tray (packages: network-manager-applet, blueman)
exec-once = nm-applet
exec-once = blueman-applet

# Optional: keep XDG portals in sync after sleep (uncomment if needed)
# exec-once = /usr/lib/xdg-desktop-portal-hyprland
