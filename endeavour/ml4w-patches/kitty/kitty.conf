# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none
cursor_trail 1

# SSH to Jetson / embedded hosts: they usually lack xterm-kitty terminfo, which
# breaks backspace and other keys. OpenSSH forwards TERM to the remote shell.
term xterm-256color

# Terminal link clicks (Ctrl+Shift+U): use Firefox, not xdg default (often Chromium for https).
open_url_with firefox

# Paste as-is: no control-code confirmation dialog (default adds "confirm").
paste_actions quote-urls-at-prompt
