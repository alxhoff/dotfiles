# Dotfiles gap tweaks (sourced after general.conf)

general {
    gaps_in = 5
    gaps_out = 6 10 10 10
    float_gaps = 6 10 10 10
}

# i3 workspace_auto_back_and_forth: Alt+N again while on workspace N returns to where you came from.
binds {
    workspace_back_and_forth = true
    # Cycle tabs inside a group first; at group edges, focus moves to other windows/monitors.
    window_direction_monitor_fallback = true
    movefocus_cycles_groupfirst = true
    movefocus_cycles_fullscreen = false
}
