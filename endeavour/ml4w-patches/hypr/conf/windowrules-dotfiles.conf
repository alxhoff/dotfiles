# Dotfiles window rules (Hyprland 0.55+)

# Cursor was opening/toggling floated with extra top inset; keep it tiled like other apps.
windowrule {
    name = cursor-tile
    match:class = ^cursor$
    tile = on
}

# Remote viewers: tiled resize can break the viewport; keep floating on open.
windowrule {
    name = vncviewer-float
    match:class = ^realvnc-vncviewer$
    float = on
    center = on
}

# Guake-style dropdown terminal (Alt+F12) — geometry in dropdown-terminal.sh
windowrule {
    name = dropdown-terminal
    match:class = ^dropdown-terminal$
    float = on
}

# Dropdown Spotify (Alt+F11) — geometry applied by dropdown-spotify.sh on the focused monitor
windowrule {
    name = spotify-dropdown
    match:class = ^[Ss]potify$
    workspace = special:spotify silent
    float = on
}
