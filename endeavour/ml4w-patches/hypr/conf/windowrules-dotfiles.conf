# Dotfiles window rules (Hyprland 0.55+)

# Steam Link: don't tile — resizing breaks the stream viewport on Wayland/Qt.
windowrule {
    name = steamlink-float
    match:class = ^com\.valvesoftware\.steamlink$
    float = on
    center = on
    size = 75% 75%
}

# Remote viewers: same tiled-resize pain; keep floating on open.
windowrule {
    name = vncviewer-float
    match:class = ^realvnc-vncviewer$
    float = on
    center = on
}
