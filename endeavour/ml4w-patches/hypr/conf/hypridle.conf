# Idle: dim laptop panel → lock (5 min) → suspend on battery only (30 min).
# No global "dpms off" — on docked MST monitors (Synaptics USB-C) that often
# leaves the session locked but keyboard/mouse cannot wake the displays.
# Suspend/hibernate are skipped while AC or USB-C PD is online.
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = sh -c 'killall hyprlock 2>/dev/null; $HOME/.config/ml4w/scripts/brightness-laptop.sh restore; [[ -f ${XDG_RUNTIME_DIR:-/tmp}/dotfiles-display-needs-refresh ]] && $HOME/.config/ml4w/scripts/refresh-session-layouts.sh'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sh -c 'hyprctl dispatch dpms on; $HOME/.config/ml4w/scripts/brightness-laptop.sh restore'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = $HOME/.config/ml4w/scripts/brightness-laptop.sh dim
    on-resume = $HOME/.config/ml4w/scripts/brightness-laptop.sh restore
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume = sh -c 'hyprctl dispatch dpms on; $HOME/.config/ml4w/scripts/brightness-laptop.sh restore'
}

listener {
    timeout = 1800
    on-timeout = $HOME/.config/ml4w/scripts/suspend-if-battery.sh
}
