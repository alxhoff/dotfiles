# Idle: dim → lock (5 min, compliance max) → screen off → suspend
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = sh -c 'killall hyprlock 2>/dev/null; $HOME/.config/ml4w/scripts/brightness-laptop.sh restore'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sh -c 'hyprctl dispatch dpms on; $HOME/.config/ml4w/scripts/brightness-laptop.sh restore'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = $HOME/.config/ml4w/scripts/brightness-laptop.sh dim
    on-resume = $HOME/.config/ml4w/scripts/brightness-laptop.sh restore
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
