# Hyprlock — clean default (dotfiles)
general {
    ignore_empty_input = true
    grace = 1
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

input-field {
    size = 260, 54
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 2
    inner_color = rgba(15, 15, 20, 0.75)
    outer_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(240, 240, 245)
    placeholder_text = Password
    check_color = rgb(120, 200, 140)
    fail_color = rgb(220, 100, 100)
    font_family = Fira Sans
    rounding = 10
}

label {
    clock = yes
    text = $TIME
    position = 0, 90
    halign = center
    font_size = 56
    font_color = rgb(240, 240, 245)
    font_family = Fira Sans
}

label {
    text = Locked
    position = 0, 150
    halign = center
    font_size = 16
    font_color = rgba(240, 240, 245, 0.6)
    font_family = Fira Sans
}
