# Dotfiles keybinds (sourced at end of hyprland.conf)

bind = SUPER, D, exec, rofi -show drun

# Power menu (logout, shutdown — works without wlogout)
bind = SUPER, X, exec, ~/.config/ml4w/scripts/powermenu.sh

# Emergency: force laptop panel on if dock/unplug left you with a black screen
bind = SUPER SHIFT, L, exec, ~/git/Github/dotfiles/endeavour/displays/recover-laptop-display.sh

# Apply home dock layout (3 externals + laptop off)
bind = SUPER SHIFT, H, exec, ~/git/Github/dotfiles/endeavour/displays/apply-display-profile.sh home
