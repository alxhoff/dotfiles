# i3 keybinds from ~/.i3/config on backup disk (2025-09-10 Manjaro i3)
# Alt = Mod1. Sourced after binds.conf (media + mouse only).

$mod = ALT
$term = kitty
$browser = firefox
$cliphist = ~/.config/ml4w/scripts/cliphist-rofi.sh
$keybinds = ~/.config/ml4w/scripts/keybinds-cheatsheet.sh
$move_i3 = ~/.config/ml4w/scripts/move-window-i3.sh
$displays = ~/git/Github/dotfiles/endeavour/displays/apply-display-profile.sh

# --- Terminal ---
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Return, exec, $term -e fish -c ub

# --- Passthrough (games etc.) ---
bind = $mod, Escape, submap, passthrough
submap = passthrough
bind = $mod, Escape, submap, reset
bind = , Escape, submap, reset
submap = reset

# --- Apps ---
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, rofi -show drun
bind = $mod, O, exec, rofi -show filebrowser
bind = $mod, C, exec, $browser
bind = $mod, V, exec, $cliphist
bind = $mod, slash, exec, $keybinds
bind = $mod, Z, exec, rofi -show drun -show-icons

bind = $mod, U, exec, hyprctl keyword general:border_size 0
bind = $mod, Y, exec, hyprctl keyword general:border_size 1
bind = $mod, N, exec, hyprctl keyword general:border_size 2

bind = $mod CTRL, M, exec, pavucontrol
bind = $mod CTRL, B, exec, $term -e bmenu
bind = $mod SHIFT, F3, exec, pcmanfm_pkexec
bind = $mod, F5, exec, $term -e mocp
bind = $mod SHIFT, D, exec, bash -c 'killall dunst; notify-send dunst restarted'
bind = $mod SHIFT, H, exec, xdg-open /usr/share/doc/manjaro/i3_help.pdf
bind = $mod CTRL, X, exec, xkill

# --- Focus (vim: j=left k=down l=up ;=right) ---
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, semicolon, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, J, exec, $move_i3 l
bind = $mod SHIFT, K, exec, $move_i3 d
bind = $mod SHIFT, L, exec, $move_i3 u
bind = $mod SHIFT, semicolon, exec, $move_i3 r
bind = $mod SHIFT, left, exec, $move_i3 l
bind = $mod SHIFT, down, exec, $move_i3 d
bind = $mod SHIFT, up, exec, $move_i3 u
bind = $mod SHIFT, right, exec, $move_i3 r

# --- Workspaces ---
bind = $mod, B, workspace, previous
bind = $mod SHIFT, B, exec, bash -c 'hyprctl dispatch movetoworkspacesilent previous; hyprctl dispatch workspace previous'

bind = $mod CTRL, right, workspace, e+1
bind = $mod CTRL, left, workspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, name:0

bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod CTRL, 9, movetoworkspacesilent, 9
bind = $mod CTRL, 0, movetoworkspacesilent, name:0

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, name:0

# --- Layout ---
bind = $mod, H, layoutmsg, toggleorientation
bind = $mod, V, layoutmsg, toggleorientation
bind = $mod, Q, layoutmsg, togglesplit
bind = $mod, F, fullscreen
bind = $mod, S, exec, hyprctl keyword general:layout master
bind = $mod, W, exec, hyprctl keyword general:layout master
bind = $mod, E, layoutmsg, togglesplit
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod, SPACE, focuscurrentorlast
bind = $mod SHIFT, S, pin
bind = $mod, A, focuscurrentorlast

# --- Scratchpad ---
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad

# --- Hyprland session ---
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, bash -c 'hyprctl reload; pkill -SIGUSR2 waybar 2>/dev/null || waybar &'
bind = $mod SHIFT, E, exec, nemo
bind = $mod SHIFT, P, submap, power
bind = $mod, R, submap, resize
bind = $mod, P, exec, hyprlock

# --- Bar / gaps ---
bind = $mod, M, exec, pkill -SIGUSR2 waybar 2>/dev/null || waybar &
bind = $mod SHIFT, G, submap, gaps

# --- Screenshots ---
bind = , Print, exec, grim
bind = $mod, Print, exec, grim -g "$(slurp)"
bind = $mod SHIFT, Print, exec, grim -g "$(slurp)"

# --- Display profiles (Hyprland extra; not in old i3 backup) ---
bind = $mod, X, submap, displays

# --- Submaps ---
submap = power
bind = , L, exec, hyprlock
bind = , S, exec, bash -c 'loginctl lock-session; systemctl suspend'
bind = , U, exec, loginctl lock-sessions
bind = , E, exit
bind = , H, exec, systemctl hibernate
bind = , R, exec, systemctl reboot
bind = SHIFT, S, exec, systemctl poweroff
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

submap = displays
bind = , W, exec, $displays work
bind = , H, exec, $displays home
bind = , L, exec, $displays laptop
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

submap = resize
bind = , J, resizeactive, -20 0
bind = , K, resizeactive, 0 20
bind = , L, resizeactive, 0 -20
bind = , semicolon, resizeactive, 20 0
bind = , left, resizeactive, -20 0
bind = , down, resizeactive, 0 20
bind = , up, resizeactive, 0 -20
bind = , right, resizeactive, 20 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

submap = gaps
bind = , I, exec, bash -c 'g=$(hyprctl getoption general:gaps_in -i | awk "{print \$2}"); hyprctl keyword general:gaps_in $((g+5))'
bind = , O, exec, bash -c 'g=$(hyprctl getoption general:gaps_in -i | awk "{print \$2}"); hyprctl keyword general:gaps_in $((g-5))'
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
