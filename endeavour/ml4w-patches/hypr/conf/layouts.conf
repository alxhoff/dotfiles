dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile removed in Hyprland 0.55 — Super+P (pseudo bind) still works
    preserve_split = true # required for togglesplit; you probably want this
    permanent_direction_override = true # i3 split h/v sticks until changed
    smart_split = true # cursor-based split direction; also helps preserve_split
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_status = master
}
