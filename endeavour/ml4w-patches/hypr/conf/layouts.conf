dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile removed in Hyprland 0.55 — Super+P (pseudo bind) still works
    preserve_split = true # Alt+Q/E togglesplit
    permanent_direction_override = true # Alt+H/V preselect sticks until changed
    smart_split = false # preselect + split-i3.sh; smart_split fights Alt+H/V
    smart_resizing = false # resize by tile position, not cursor corner
    default_split_ratio = 1.0 # 50/50 on each new split
    split_bias = 0 # split the outer pane, not only the focused window's half
    use_active_for_splits = true
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_status = master
}
