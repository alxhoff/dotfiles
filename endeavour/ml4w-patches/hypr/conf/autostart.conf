# Execute your favorite apps at launch
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst

# NetworkManager tray (waybar network click + WiFi)
exec-once = nm-applet --indicator

# Dotfiles: dock layouts (listener waits for monitors, then applies home/laptop)
exec-once = ~/git/Github/dotfiles/endeavour/displays/hypr-display-listener.sh

