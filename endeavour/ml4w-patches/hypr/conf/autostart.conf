# Execute your favorite apps at launch
exec-once = ~/.config/ml4w/scripts/waybar-launch.sh
exec-once = hyprpaper
exec-once = bash -c 'sleep 1; waypaper --restore 2>/dev/null || true'
exec-once = dunst

# Auth prompts (GUI package installs)
exec-once = bash -c 'for a in /usr/lib/polkit-kde-authentication-agent-1/polkit-kde-authentication-agent-1 /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1; do [[ -x "$a" ]] && exec "$a"; done'

# Clipboard history + persist after source app closes
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard both

# Idle lock / suspend
exec-once = hypridle

# NetworkManager tray (waybar network click + WiFi)
exec-once = nm-applet --indicator

# Dotfiles: dock layouts (listener waits for monitors, then applies home/laptop)
exec-once = ~/git/Github/dotfiles/endeavour/displays/hypr-display-listener.sh
