[Settings]
language = en
backend = hyprpaper
folder = ~/Pictures/wallpaper
monitors = All
show_path_in_tooltip = True
fill = cover
sort = name
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
# Apply to every monitor (hyprpaper 0.8+ IPC)
post_command = bash -c 'for m in $(hyprctl monitors | awk "/^Monitor/{print \$2}"); do hyprctl hyprpaper wallpaper "$m,$wallpaper,cover"; done'
number_of_columns = 3
use_xdg_state = False
