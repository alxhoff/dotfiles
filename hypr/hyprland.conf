# Minimal Hyprland config (dotfiles) — grow incrementally from here.
# Replaces ML4W starter until you opt back in (see hypr/README.md).
#
# Logs: ~/.cache/hyprland/hyprland.log (after session)
#       journalctl --user -b | grep -i hypr

# Monitors — auto; use endeavour/displays/ for home/work profiles later
monitor=,preferred,auto,1

# --- Environment ---
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Autostart (keep minimal) ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = mako

# --- Look & feel (simple defaults) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(51cc99ff)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
}

input {
    kb_layout = us
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
}

# --- Keybinds (i3 used Mod1 = Alt) ---
source = ~/.config/hypr/binds.conf
