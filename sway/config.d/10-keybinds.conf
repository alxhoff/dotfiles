# Keybinds: i3/config + current dotfiles habits (kitty, rofi, grim).

set $term kitty
set $browser firefox
set $dotfiles ~/.config/dotfiles
set $sway_scripts ~/.config/sway/scripts
set $ml4w ~/.config/ml4w/scripts
set $displays ~/.config/dotfiles/endeavour/displays/apply-display-profile.sh

# --- Terminal (bash: script may be missing from ~/.config/ml4w until link-configs) ---
bindsym $mod+Return exec bash $ml4w/terminal-launch.sh
bindsym $mod+Shift+Return exec bash $ml4w/terminal-launch.sh -e fish -c ub
bindsym $mod+F12 exec $ml4w/dropdown-terminal.sh
bindsym $mod+F11 exec $ml4w/dropdown-spotify.sh

# --- Media keys / hardware knobs (Hyprland: binds.conf) ---
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym XF86WLAN exec nmcli radio wifi toggle
bindsym XF86Refresh exec xdotool key F5

# --- Passthrough / Steam Link (Escape in 05-mouse-passthrough.conf) ---
bindsym $mod+Ctrl+g exec $ml4w/steamlink-game-mode.sh
bindsym $mod+Ctrl+u exec $ml4w/steamlink-ungrab.sh

# --- Apps ---
bindsym $mod+Shift+q kill
bindsym $mod+d exec rofi -show drun
bindsym $mod+o exec rofi -show filebrowser
bindsym $mod+c exec $browser
bindsym $mod+Ctrl+v exec ~/.config/ml4w/scripts/cliphist-rofi.sh
bindsym $mod+slash exec $sway_scripts/keybinds-cheatsheet.sh
bindsym $mod+z exec rofi -show drun -show-icons
bindsym $mod+Shift+e exec nemo
bindsym $mod+Ctrl+m exec pavucontrol
bindsym $mod+Ctrl+b exec $term -e bmenu
bindsym $mod+Shift+F3 exec pcmanfm_pkexec
bindsym $mod+F5 exec $term -e mocp
bindsym $mod+Shift+d exec ~/.config/ml4w/scripts/notification-daemon.sh
bindsym $mod+Shift+h exec xdg-open /usr/share/doc/manjaro/i3_help.pdf

# --- Wallpapers (waypaper + swaybg — same folder as Hyprland) ---
bindsym $mod+Ctrl+w exec ~/.config/sway/scripts/waypaper.sh
bindsym $mod+Shift+w exec ~/.config/sway/scripts/wallpaper-random.sh

# --- Borders ---
bindsym $mod+u border none
bindsym $mod+y border pixel 1
bindsym $mod+n border normal

# --- Focus (i3 j/k/l/;) ---
bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+l focus up
bindsym $mod+semicolon focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# --- Move ---
bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+semicolon move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# --- Workspaces ---
bindsym $mod+b workspace back_and_forth
bindsym $mod+Shift+b move container to workspace back_and_forth; workspace back_and_forth
bindsym $mod+Ctrl+Right workspace next
bindsym $mod+Ctrl+Left workspace prev

set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5
set $ws6 6
set $ws7 7
set $ws8 8
set $ws9 9
set $ws0 0

bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws0

bindsym $mod+Ctrl+1 move container to workspace number $ws1
bindsym $mod+Ctrl+2 move container to workspace number $ws2
bindsym $mod+Ctrl+3 move container to workspace number $ws3
bindsym $mod+Ctrl+4 move container to workspace number $ws4
bindsym $mod+Ctrl+5 move container to workspace number $ws5
bindsym $mod+Ctrl+6 move container to workspace number $ws6
bindsym $mod+Ctrl+7 move container to workspace number $ws7
bindsym $mod+Ctrl+8 move container to workspace number $ws8
bindsym $mod+Ctrl+9 move container to workspace number $ws9
bindsym $mod+Ctrl+0 move container to workspace number $ws0

bindsym $mod+Shift+1 move container to workspace number $ws1; workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2; workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3; workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4; workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5; workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6; workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7; workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8; workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9; workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws0; workspace number $ws0

# --- Layout (native i3 — no Hyprland groups needed) ---
bindsym $mod+h split h; exec notify-send 'tile horizontally'
bindsym $mod+v split v; exec notify-send 'tile vertically'
bindsym $mod+q split toggle
bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+Shift+s sticky toggle
bindsym $mod+a focus parent

# --- Scratchpad ---
bindsym $mod+Shift+minus move container to workspace scratchpad
bindsym $mod+minus scratchpad show

# --- Session ---
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r exec bash -c 'swaymsg reload; sleep 2; ~/.config/dotfiles/endeavour/displays/apply-display-profile.sh auto; ~/.config/sway/scripts/waybar-launch.sh'
bindsym $mod+p exec $sway_scripts/lock.sh
bindsym $mod+Shift+p mode power
bindsym $mod+r mode resize
bindsym $mod+m exec ~/.config/sway/scripts/waybar-launch.sh toggle

# --- Displays (same profiles as Hyprland) ---
bindsym $mod+x mode displays

# --- Brightness / screenshots ---
bindsym XF86MonBrightnessUp exec brightnessctl -e4 -n2 set 5%+
bindsym XF86MonBrightnessDown exec brightnessctl -e4 -n2 set 5%-
bindsym Print exec grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bindsym $mod+Print exec grim -g "$(slurp)"
bindsym $mod+Shift+Print exec grim -g "$(slurp)"

# --- Gaps submap (from i3) ---
bindsym $mod+Shift+g mode gaps
set $mode_gaps Gaps: (o) outer, (i) inner
set $mode_gaps_outer Outer Gaps: +|-|0 (local), Shift + +|-|0 (global)
set $mode_gaps_inner Inner Gaps: +|-|0 (local), Shift + +|-|0 (global)

mode gaps {
    bindsym o mode gaps_outer
    bindsym i mode gaps_inner
    bindsym Return mode default
    bindsym Escape mode default
}
mode gaps_inner {
    bindsym plus gaps inner current plus 5
    bindsym minus gaps inner current minus 5
    bindsym 0 gaps inner current set 0
    bindsym Shift+plus gaps inner all plus 5
    bindsym Shift+minus gaps inner all minus 5
    bindsym Shift+0 gaps inner all set 0
    bindsym Return mode default
    bindsym Escape mode default
}
mode gaps_outer {
    bindsym plus gaps outer current plus 5
    bindsym minus gaps outer current minus 5
    bindsym 0 gaps outer current set 0
    bindsym Shift+plus gaps outer all plus 5
    bindsym Shift+minus gaps outer all minus 5
    bindsym Shift+0 gaps outer all set 0
    bindsym Return mode default
    bindsym Escape mode default
}

mode resize {
    bindsym j resize shrink width 20px
    bindsym k resize grow height 20px
    bindsym l resize shrink height 20px
    bindsym semicolon resize grow width 20px
    bindsym Left resize shrink width 20px
    bindsym Down resize grow height 20px
    bindsym Up resize shrink height 20px
    bindsym Right resize grow width 20px
    bindsym Return mode default
    bindsym Escape mode default
}

mode displays {
    bindsym w exec $displays work
    bindsym h exec $displays home
    bindsym l exec $displays laptop
    bindsym Return mode default
    bindsym Escape mode default
}

mode power {
    bindsym l exec ~/.config/sway/scripts/lock.sh
    bindsym s exec bash -c '~/.config/sway/scripts/lock.sh; systemctl suspend'
    bindsym e exec swaymsg exit
    bindsym h exec ~/.config/ml4w/scripts/hibernate-if-battery.sh --notify
    bindsym r exec systemctl reboot
    bindsym Shift+s exec systemctl poweroff
    bindsym Return mode default
    bindsym Escape mode default
}
