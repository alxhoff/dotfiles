# Ported from i3/config — visuals, gaps, input.
# Tab/stack title bars: colors + font aligned with waybar (style-overrides.css).

set $mod Mod1

default_border pixel 2
default_floating_border normal
hide_edge_borders smart
font pango:Fira Sans 11
title_align center
titlebar_padding 16 7

floating_modifier $mod

# class                   border  backgr. text    indic.   child_border
client.focused          #7eb8da #1e1e24 #7eb8da #7eb8da #7eb8da
client.focused_inactive #121216 #121216 #9696a0 #121216 #454948
client.unfocused        #121216 #121216 #7a7a84 #121216 #2a2a30
client.urgent           #b84a1a #1e1e24 #e8e8ec #b84a1a #121216
client.placeholder      #121216 #121216 #505058 #121216 #121216
client.background       #121216

# Gaps — inner = space between tiled windows; outer = margin to screen edge.
# Hypr gaps_in=5 is per-side (10px between windows); Sway inner is the full strip.
# Outer kept smaller than before so edges don't look oversized vs splits.
gaps inner 14
gaps top 3
gaps right 4
gaps bottom 4
gaps left 4
smart_gaps off
smart_borders off

workspace_auto_back_and_forth yes

input type:keyboard {
    xkb_layout us
}

input type:touchpad {
    dwt enabled
    tap enabled
    natural_scroll disabled
}

seat seat0 hide_cursor 10000
