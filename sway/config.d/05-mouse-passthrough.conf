# Mouse binds + game passthrough mode (matches Hyprland binds.conf).

set $mod Mod1

bindsym $mod+button1 move container
bindsym $mod+button3 resize container
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

bindsym $mod+Escape exec ~/.config/ml4w/scripts/passthrough-toggle.sh

mode "passthrough" {
    bindsym $mod+Escape exec ~/.config/ml4w/scripts/passthrough-toggle.sh
    bindsym Return mode default
    bindsym Escape mode default
}
