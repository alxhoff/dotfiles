# Window rules from i3/config (still useful on Wayland).
# Specific rules before broad kitty tiling rule.

for_window [title="Dropdown"] floating enable
for_window [app_id="dropdown-terminal"] floating enable
for_window [class="dropdown-terminal"] floating enable
for_window [app_id="spotify"] floating enable
for_window [app_id="Spotify"] floating enable
for_window [class="Spotify"] floating enable
for_window [class="spotify"] floating enable
for_window [app_id="discord"] floating enable
for_window [app_id="Discord"] floating enable
for_window [class="discord"] floating enable
for_window [class="Discord"] floating enable
for_window [app_id="kitty"] floating disable

for_window [title="alsamixer"] floating enable; border pixel 1
for_window [app_id="calamares"] floating enable; border normal
for_window [app_id="clipgrab"] floating enable
for_window [title="File Transfer*"] floating enable
for_window [app_id="fpakman"] floating enable
for_window [app_id="galculator"] floating enable; border pixel 1
for_window [app_id="gparted"] floating enable; border normal
for_window [title="i3_help"] floating enable; sticky enable; border normal
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="octopi"] floating enable
for_window [app_id="pamac-manager"] floating enable
for_window [app_id="simple-scan"] floating enable; border normal
for_window [app_id="VirtualBox"] floating enable; border normal
for_window [app_id="steam"] move container to workspace number 9

for_window [urgent="latest"] focus
