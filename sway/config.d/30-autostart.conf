# Match Hyprland/ML4W autostart.

exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway SHELL
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec bash -c 'for a in /usr/lib/polkit-kde-authentication-agent-1/polkit-kde-authentication-agent-1 /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1; do [[ -x "$a" ]] && exec "$a"; done'
exec ~/.config/ml4w/scripts/notification-daemon.sh
exec nm-applet --indicator
exec blueman-applet

exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
exec wl-clip-persist --clipboard both

# exec-once (not exec_always): waybar-launch exits after spawning bars; exec_always
# would restart it forever and pkill/relaunch waybar in a loop.
exec ~/.config/sway/scripts/waybar-launch.sh
exec bash -c 'sleep 1; ~/.config/sway/scripts/wallpaper-restore.sh'

exec swayidle -w \
    timeout 240 '~/.config/ml4w/scripts/brightness-laptop.sh dim' '~/.config/ml4w/scripts/brightness-laptop.sh restore' \
    timeout 300 '~/.config/sway/scripts/lock.sh' \
    timeout 1800 '~/.config/ml4w/scripts/suspend-if-battery.sh' \
    before-sleep '~/.config/sway/scripts/lock.sh'

exec ~/.config/dotfiles/endeavour/displays/restart-display-listener.sh
exec_always ~/.config/sway/scripts/session-bootstrap.sh
